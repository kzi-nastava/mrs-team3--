<button
  pButton
  [label]="isBlocked ? 'Unblock user' : 'Block user'"
  [severity]="isBlocked ? 'success' : 'danger'"
  (click)="openDialog()"
  [loading]="loading">
</button>

<p-dialog
  header="Block user"
  [(visible)]="showDialog"
  [modal]="true"
  [style]="{width:'400px'}"
  [draggable]="false"
  [resizable]="false">

  <textarea
    [(ngModel)]="reason"
    rows="4"
    placeholder="Enter reason..."
    style="width:100%; margin-top:1rem;">
  </textarea>

  <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:1rem;">
    <button
      pButton
      label="Cancel"
      severity="secondary"
      (click)="showDialog=false">
    </button>

    <button
      pButton
      label="Confirm"
      severity="danger"
      (click)="confirmBlock()">
    </button>
  </div>

</p-dialog>
