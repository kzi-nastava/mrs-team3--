<div class="icon-sidebar">
  <button class="icon-btn" (click)="goHome()" title="Home">
    🏠
  </button>
  <button class="icon-btn" (click)="registerDriver()" title="Register Driver">
    🚗
  </button>
  <button class="icon-btn notification-btn" (click)="goNotifications()" title="Notifications">
    🔔
    @if (unreadCount > 0) {
    <span class="notification-badge">{{unreadCount}}</span>
    } </button>
  <button class="icon-btn" (click)="goProfileChangeRequests()" title="Profile Change Requests">
    📝
  </button>
  <button class="icon-btn" (click)="goPricing()" title="Pricing Management">
    📊
  </button>
  <div class="spacer"></div>
  <button class="icon-btn" (click)="goProfile()" title="Profile">
    👤
  </button>
  <button class="icon-btn logout-btn" (click)="logout()" title="Logout">
    🚪
  </button>
</div>

@if (showLogoutModal) {
<app-logout-modal (confirm)="onLogoutConfirm()" (cancel)="onLogoutCancel()">
</app-logout-modal>
}
