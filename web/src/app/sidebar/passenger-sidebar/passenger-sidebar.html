<div class="icon-sidebar">
  <button id="home-btn" class="icon-btn" (click)="goHome()" title="Home">
    🏠
  </button>
  <button id="history-btn" class="icon-btn" (click)="goHistory()" title="Ride History">
    📋
  </button>
  <button id="messages-btn" class="icon-btn" (click)="goMessages()" title="Messages">
    💬
  </button>
  <button id="tracking-ride-btn" class="icon-btn" (click)="goTrackingRide()" title="Tracking Ride">
    🚗
  </button>
  <button id="incoming-rides-btn" class="icon-btn" (click)="incomingRides()" title="Incoming Rides">
    ⏳
  </button>
  <button id="notifications-btn" class="icon-btn notification-btn" (click)="goNotifications()" title="Notifications">
    <span class="bell-icon">🔔</span>
    @if (unreadCount > 0) {
    <span class="notification-badge">{{unreadCount}}</span>
    }
  </button>

  <button id="analytics-btn" class="icon-btn" (click)="goReport()" title="Analytics">
    📈
  </button>


  <div class="spacer"></div>
  <button id="profile-btn" class="icon-btn" (click)="goProfile()" title="Profile">
    👤
  </button>
  <button id="logout-btn" class="icon-btn logout-btn" (click)="logout()" title="Logout">
    🚪
  </button>
</div>

<app-chat-popup></app-chat-popup>

@if (showLogoutModal) {
<app-logout-modal (confirm)="onLogoutConfirm()" (cancel)="onLogoutCancel()">
</app-logout-modal>
}
