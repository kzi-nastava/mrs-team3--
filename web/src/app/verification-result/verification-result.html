<div class="verification-container">
  <p-card class="verification-card">
    <div class="text-center">
      <div class="title">{{ title }}</div>
      <p class="subtitle">{{ message }}</p>

      <button
        type="button"
        class="login-link"
        (click)="goToLogin()">
        Go to login
      </button>
    </div>
  </p-card>
</div>
